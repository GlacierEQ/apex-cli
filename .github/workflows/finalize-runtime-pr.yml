name: Finalize Runtime PR

on:
  push:
    branches: [feat/canonical-runtime-projection-v2]
    paths: [RUNTIME_PUBLIC_PROOF.json]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-runtime-projection-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify proof lineage
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          p=json.load(open('RUNTIME_PUBLIC_PROOF.json'))
          assert p['schema']=='glaciereq.runtime-public-proof.v2' and p['status']=='VERIFIED', p
          assert p['canonical_commit']=='84a2907a316327e91dc0426f5407a34908aa4fc4', p
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert p['tested_sha']==parent,(p['tested_sha'],parent)
          PY
          cmp -s install.sh install-runtime-v2.sh
      - name: Reprove marker commit
        shell: bash
        run: |
          home="$(mktemp -d)"; export HOME="$home"
          bash ./install.sh >/tmp/final-install.log
          "$HOME/bin/apex" replay "$HOME/.apex/last_runtime_receipt.json" >/tmp/final-replay.json
          python - /tmp/final-replay.json <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); assert p['status']=='VERIFIED',p
          PY
      - name: Merge verified runtime PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 3 --repo GlacierEQ/apex-cli --squash --delete-branch=false --subject 'feat(runtime): distribute canonical resumable capability kernel' --body 'Merged only after Final Runtime Proof persisted a VERIFIED marker and marker-commit clean-home replay re-attested successfully.'
