name: Sync Runtime Installer V2

on:
  push:
    branches: [feat/canonical-runtime-projection-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate synchronized installers
        shell: bash
        run: |
          cmp -s install.sh install-runtime-v2.sh || {
            echo "installer drift: update both public installers in the same candidate before proof" >&2
            exit 1
          }
          bash -n install.sh install-runtime-v2.sh
