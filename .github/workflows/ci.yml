name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Current-tree security gate
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-ci.yml@de58bce31d7099af7e89c8d8a3b6472356b0cec3
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      run_tests: false
      run_lint: false
      run_security: true
      run_build: false

  legacy-lint-audit:
    name: Legacy whole-tree lint debt (fail-visible)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Audit preserved legacy tree
        run: ruff check . --output-format=github

  memory-federation:
    name: Memory federation non-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused runtime dependency
        run: python -m pip install --upgrade aiohttp

      - name: Compile memory runtime
        run: |
          python -m py_compile core/memory_connect_core.py
          python -m py_compile bundle/scripts/memory_connect_core.py
          python -m py_compile core/unified_memory_mcp.py

      - name: Prove federation semantics
        run: python -m unittest tests.test_memory_federation_semantics -v

  benchmark:
    name: Optional external integration benchmark
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp psycopg2-binary

      - name: Execute optional APEX multiplexer benchmark
        env:
          APEX_NEO4J_DIRECT_CONN: ${{ secrets.APEX_NEO4J_DIRECT_CONN }}
          APEX_BRIDGE_URL: ${{ secrets.APEX_BRIDGE_URL }}
        run: python core/benchmark_pipeline.py
