name: Runtime Post-Merge Cleanup

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'GlacierEQ/apex-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, fetch-depth: 0}
      - name: Remove superseded transport and integration scaffolding
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            install-runtime-v2.sh \
            bundle/runtime-projection/PACKAGE.json \
            bundle/runtime-projection/runtime_projection_part_00.b64 \
            bundle/runtime-projection/runtime_projection_part_01.b64 \
            bundle/runtime-projection/runtime_projection_part_02.b64 \
            bundle/runtime-projection/runtime_projection_part_03.b64 \
            bundle/runtime-projection/runtime_projection_part_04.b64 \
            bundle/runtime-projection/source_part_00.txt \
            bundle/runtime-projection/source_part_01.txt \
            bundle/runtime-projection/source_part_02.txt \
            bundle/runtime-projection/source_part_03.txt \
            bundle/runtime-projection/source_part_04.txt \
            bundle/runtime-projection/source_part_05.txt \
            .github/workflows/sync-runtime-installer.yml \
            .github/workflows/sync-runtime-installer-v2.yml \
            .github/workflows/final-runtime-proof.yml \
            .github/workflows/finalize-runtime-pr.yml \
            .github/workflows/runtime-post-merge-cleanup.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name glaciereq-runtime-bot
          git config user.email runtime-bot@users.noreply.github.com
          git commit -m 'chore(runtime): remove superseded integration scaffolding'
          git push origin HEAD:master
