name: Public Truth Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install public proof dependency
        run: python -m pip install --upgrade pytest

      - name: Compile repository-local Python surfaces
        run: python -m compileall -q core tests bundle/scripts/verify_mem0_layers.py

      - name: Run bounded public-surface tests
        run: python -m pytest -q tests/test_public_surface.py

      - name: Verify shell entrypoint syntax and behavior
        run: |
          bash -n apex
          ./apex help >/tmp/apex-help.txt
          grep -q 'External job-app commands fail closed' /tmp/apex-help.txt

      - name: Verify public boundary
        run: |
          ! grep -q '/data/data/com.termux/' tests/test_end_to_end_casebuild.py
          grep -q 'APEX_CASEBUILDER_ROOT' tests/test_end_to_end_casebuild.py
          grep -q 'repository-local' README.md
          grep -q 'does not prove' README.md
          ! git grep -nE 'github_pat_[A-Za-z0-9_]{40,}|gh[pousr]_[A-Za-z0-9]{20,}|ntn_[A-Za-z0-9]{20,}' -- .
          ! grep -q 'Fallback to known valid pro key' bundle/scripts/verify_mem0_layers.py
