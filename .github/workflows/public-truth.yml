name: Public Truth Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install public proof dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile repository-local Python surfaces
        run: python -m compileall -q core tests scripts bundle/scripts/verify_mem0_layers.py bundle/scripts/dynamic_skill_activator.py

      - name: Run bounded public-surface tests
        run: python -m pytest -q tests/test_public_surface.py

      - name: Verify shell entrypoint syntax and behavior
        run: |
          bash -n apex install.sh apex-auto-start bundle/config/startup.sh
          ./apex help >/tmp/apex-help.txt
          grep -q 'External job-app commands fail closed' /tmp/apex-help.txt

      - name: Prove fresh-install nervous-system runtime
        shell: bash
        run: |
          runtime_home="$(mktemp -d)"
          HOME="$runtime_home" bash ./install.sh >/tmp/apex-install.txt
          test -f "$runtime_home/.apex/MASTERSKILL_ACTIVATION.json"
          test -x "$runtime_home/.apex/startup.sh"
          test -f "$runtime_home/.agents/skills/glaciereq-nervous-system/SKILL.md"
          test -f "$runtime_home/.agents/skills/apex-aspen-grove-bootup/SKILL.md"
          test -f "$runtime_home/.agents/skills/verification/SKILL.md"
          test -f "$runtime_home/.apex/last_runtime_receipt.json"
          HOME="$runtime_home" "$runtime_home/bin/apex" runtime-status >/tmp/apex-runtime-status.json
          python - "$runtime_home/.apex/last_runtime_receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert receipt["status"] == "READY", receipt
          assert receipt["masterskill"] == "glaciereq-nervous-system", receipt
          assert receipt["skills"][0]["name"] == "glaciereq-nervous-system", receipt
          assert not receipt["missing_skills"], receipt
          PY

      - name: Verify public boundary
        run: |
          ! grep -q '/data/data/com.termux/' tests/test_end_to_end_casebuild.py
          grep -q 'APEX_CASEBUILDER_ROOT' tests/test_end_to_end_casebuild.py
          grep -q 'repository-local' README.md
          grep -q 'does not prove' README.md
          ! git grep -nE 'github_pat_[A-Za-z0-9_]{40,}|gh[pousr]_[A-Za-z0-9]{20,}|ntn_[A-Za-z0-9]{20,}' -- .
          ! grep -q 'Fallback to known valid pro key' bundle/scripts/verify_mem0_layers.py
          python scripts/verify_public_truth.py
