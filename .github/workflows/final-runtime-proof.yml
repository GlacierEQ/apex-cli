name: Final Runtime Proof

on:
  push:
    branches: [feat/canonical-runtime-projection-v2]
    paths-ignore: [RUNTIME_PUBLIC_PROOF.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-runtime-projection-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Require synchronized public installer
        run: |
          cmp -s install.sh install-runtime-v2.sh
          bash -n install.sh install-runtime-v2.sh bundle/config/startup.sh apex
      - name: Clean-home install and canonical attestation
        shell: bash
        run: |
          home="$(mktemp -d)"; echo "APEX_PROOF_HOME=$home" >> "$GITHUB_ENV"; export HOME="$home"
          bash ./install.sh
          apex="$HOME/bin/apex"
          "$apex" runtime-status > /tmp/status.json
          "$apex" replay "$HOME/.apex/last_runtime_receipt.json" > /tmp/replay.json
          python - "$HOME/.apex/last_runtime_receipt.json" /tmp/status.json /tmp/replay.json <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text()); s=json.loads(Path(sys.argv[2]).read_text()); a=json.loads(Path(sys.argv[3]).read_text())
          assert r['schema']=='glaciereq.runtime-receipt.v2'
          assert r['status']=='READY'
          assert r['runtime']['canonical_repository']=='GlacierEQ/apex-boot-core'
          assert r['runtime']['canonical_commit']=='84a2907a316327e91dc0426f5407a34908aa4fc4'
          assert 'PERSIST' in r['continuation']['completed_stages']
          assert r['attestation_payload_sha256']
          assert s['composition_status']=='READY'
          assert a['status']=='VERIFIED'
          assert any(x['name']=='canonical_commit' and x['passed'] for x in a['checks'])
          PY
      - name: Capability TTL and discovery truth
        shell: bash
        run: |
          export HOME="$APEX_PROOF_HOME"; apex="$HOME/bin/apex"
          cat >/tmp/inventory.json <<'JSON'
          {"schema":"glaciereq.capability-inventory.v2","capabilities":[
            {"capability_id":"connector.unprobed","kind":"connector","provider":"demo","ttl_seconds":900},
            {"capability_id":"model.verified","kind":"model","provider":"demo","ttl_seconds":900,"probe":{"connected":true,"authenticated":true,"authorized":true,"invokable":true,"verified":true,"latency_ms":7}}
          ]}
          JSON
          "$apex" runtimectl capability-import --inventory-json /tmp/inventory.json >/dev/null
          "$apex" runtimectl capability-register connector.expiring connector demo --ttl 0 >/dev/null
          "$apex" runtimectl capability-probe connector.expiring --connected --authenticated --authorized --invokable --verified --latency-ms 2 >/dev/null
          "$apex" capabilities >/tmp/caps.json
          "$apex" runtimectl capabilities --eligible-only --minimum-state VERIFIED >/tmp/eligible.json
          python - /tmp/caps.json /tmp/eligible.json <<'PY'
          import json,sys
          from pathlib import Path
          c=json.loads(Path(sys.argv[1]).read_text())['capabilities']; e={x['capability_id'] for x in json.loads(Path(sys.argv[2]).read_text())['capabilities']}
          assert c['connector.unprobed']['state']=='DISCOVERED'
          assert c['model.verified']['effective_state']=='VERIFIED'
          assert 'connector.unprobed' not in e and 'connector.expiring' not in e
          PY
      - name: Resume cursor and idempotent side effects
        shell: bash
        run: |
          export HOME="$APEX_PROOF_HOME"; apex="$HOME/bin/apex"
          "$apex" runtimectl start 'resume proof' --run-id resume-proof >/dev/null
          "$apex" runtimectl advance resume-proof >/dev/null
          "$apex" runtimectl checkpoint resume-proof --cursor-json '{"stage":"CAPABILITY_PROBE","action_index":7}' --dependencies-json '["connector.github"]' >/dev/null
          "$apex" resume resume-proof >/tmp/resume.json
          "$apex" runtimectl action-begin resume-proof merge repo#8 merge-proof --precondition-hash before --compensation-pointer revert#8 >/tmp/a1.json
          op="$(python -c 'import json; print(json.load(open("/tmp/a1.json"))["operation_id"])')"
          "$apex" runtimectl action-complete "$op" --result-json '{"merged":true}' --readback-json '{"state":"merged"}' --postcondition-hash after >/dev/null
          "$apex" runtimectl action-begin resume-proof merge repo#8 merge-proof >/tmp/a2.json
          python - /tmp/resume.json /tmp/a2.json <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text()); a=json.loads(Path(sys.argv[2]).read_text())
          assert r['resumable'] is True and r['next_stage']=='CAPABILITY_PROBE' and r['cursor']['action_index']==7
          assert a['status']=='COMPLETE' and a['must_not_repeat'] is True
          PY
      - name: Governor economics fallback and health
        shell: bash
        run: |
          export HOME="$APEX_PROOF_HOME"; apex="$HOME/bin/apex"
          cat >/tmp/gov.json <<'JSON'
          {"worker_slots":1,"connector_concurrency":1,"provider_concurrency":{"model":1},"token_budget":100,"context_budget":10,"retry_limit":2,"deadline_seconds":3600}
          JSON
          "$apex" runtimectl governor-acquire model infer --estimated-context-tokens 11 --config-json /tmp/gov.json >/tmp/context.json
          "$apex" runtimectl governor-provider-state github --quota-remaining 0 --reset-after 60 --config-json /tmp/gov.json >/dev/null
          "$apex" runtimectl governor-acquire github write --config-json /tmp/gov.json >/tmp/quota.json
          "$apex" runtime-health >/tmp/health.json
          python - /tmp/context.json /tmp/quota.json /tmp/health.json <<'PY'
          import json,sys
          from pathlib import Path
          c=json.loads(Path(sys.argv[1]).read_text()); q=json.loads(Path(sys.argv[2]).read_text()); h=json.loads(Path(sys.argv[3]).read_text())
          assert c['admitted'] is False and c['reason']=='context_budget'
          assert q['admitted'] is False and q['reason']=='provider_quota'
          assert h['schema']=='glaciereq.runtime-health.v2' and 'slo_evaluation' in h
          PY
      - name: Persist exact public proof marker
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          proof={
            'schema':'glaciereq.runtime-public-proof.v2',
            'status':'VERIFIED',
            'tested_sha':os.environ['GITHUB_SHA'],
            'canonical_repository':'GlacierEQ/apex-boot-core',
            'canonical_commit':'84a2907a316327e91dc0426f5407a34908aa4fc4',
            'proofs':['installer_sync','transparent_semantic_hashes','clean_home_boot','canonical_receipt','replay_attestation','capability_ttl','inventory_truth','resume_cursor','idempotency','governor_context_budget','provider_quota','runtime_health'],
            'verified_at':datetime.now(timezone.utc).isoformat()
          }
          open('RUNTIME_PUBLIC_PROOF.json','w').write(json.dumps(proof,indent=2)+'\n')
          PY
          git config user.name glaciereq-runtime-bot
          git config user.email runtime-bot@users.noreply.github.com
          git add RUNTIME_PUBLIC_PROOF.json
          git commit -m 'proof(runtime): persist verified public runtime gate'
          git push origin HEAD:feat/canonical-runtime-projection-v2
